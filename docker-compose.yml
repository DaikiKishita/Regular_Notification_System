services:
  app:
    build:
      context: ./app
    container_name: app
    ports:
      - "9577:9577"
    volumes:
      - ./app:/app
    depends_on:
      - db

db:
    image: mariadb:11
    container_name: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: rns
      MARIADB_USER: user
      MARIADB_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - ./db/data:/var/lib/mysql